<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #12151a; color: #e7e1d6; }
  body { font: 14px/1.4 "Iowan Old Style", Palatino, Georgia, serif; }
  #view { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 280px;
    max-height: calc(100% - 24px); overflow: auto;
    background: rgba(18, 21, 26, 0.92); border: 1px solid #3a342c;
    padding: 12px 14px 16px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.04em; }
  .note { color: #b7ad9e; font-size: 12px; margin: 0 0 12px; }
  button.track, button.piece {
    display: block; width: 100%; text-align: left;
    background: transparent; color: inherit; border: 0;
    font: inherit; padding: 6px 4px; cursor: pointer;
  }
  button.track { border-top: 1px solid #2c2822; }
  button.track strong { font-weight: 600; }
  button.track em, button.piece em { font-style: normal; color: #b7ad9e; float: right; font-size: 12px; }
  button.track.on, button.piece.on { background: #2a241c; }
  #load {
    background: transparent; color: inherit; border: 1px solid #3a342c;
    font: inherit; padding: 4px 8px; cursor: pointer; margin: 0 0 10px;
  }
  #meta { margin: 12px 0; color: #d9d0c3; }
  #meta p { margin: 0 0 8px; }
  #span { font-variant-numeric: tabular-nums; color: #b7ad9e; font-size: 12px; }
  ul { margin: 8px 0 0; padding: 0; list-style: none; }
  li.warn { color: #e0a070; font-size: 12px; margin-top: 4px; }
  #status { color: #e08a6a; margin: 0 0 8px; }
  #status:empty { display: none; }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="view"></div>
<aside id="panel">
  <h1>Tracks</h1>
  <p class="note">One period, from the start of the span to its seam or its end. A run does not finish on screen.</p>
  <button id="load" type="button">Load</button>
  <input id="json-file" type="file" accept=".json,application/json" hidden>
  <p id="status"></p>
  <div id="list"></div>
  <div id="meta"></div>
</aside>
