name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/build _site/runner/audio
          cp web/index.html web/manifest.json web/sw.js web/.nojekyll _site/
          cp build/runner-web.bin _site/build/
          (cd build && zip -9 ../_site/build/runner.zip runner.cue runner.bin)
          cp runner/audio/*.mp3 _site/runner/audio/
          node web/game-pages.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
