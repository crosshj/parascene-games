name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/build _site/runner/audio/menu
          cp web/index.html web/manifest.json web/favicon.svg web/.nojekyll _site/
          # The worker's URL is the commit, so Pages and Cloudflare cannot keep
          # serving the previous sw.js under the same name.
          sw="sw-${GITHUB_SHA:0:12}.js"
          cp web/sw.js "_site/$sw"
          sed -i "s|/sw.js|/$sw|" _site/index.html
          cp -r web/brand _site/
          cp runner/cover.png runner/share.png _site/runner/
          cp build/runner-web.bin _site/build/
          (cd build && zip -9 ../_site/build/runner.zip runner.cue runner.bin)
          cp runner/audio/*.mp3 _site/runner/audio/
          cp runner/audio/menu/*.mp3 _site/runner/audio/menu/
          node web/game-pages.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
