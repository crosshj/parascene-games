<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120a1a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- share -->
  <title>Parascene Games</title>
  <meta name="description" content="Strange and Playable ideas. PlayStation games from the Parascene community, free to play in your browser.">
  <link rel="canonical" href="https://games.parascene.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Parascene Games">
  <meta property="og:title" content="Parascene Games">
  <meta property="og:description" content="Strange and Playable ideas. PlayStation games from the Parascene community, free to play in your browser.">
  <meta property="og:url" content="https://games.parascene.com/">
  <meta property="og:image" content="https://games.parascene.com/brand/share.png">
  <meta property="og:image:width" content="1200">

  <meta property="og:image:alt" content="Parascene Games: Strange and Playable ideas.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- /share -->
  <style>
    @font-face { font-family: "04b_03"; src: url("brand/04b03.woff2") format("woff2"); font-display: swap; }
    :root {
      color-scheme: dark;
      --bg: #120a1a; --panel: #1e1626; --face: #2a2234; --hi: color-mix(in srgb, var(--face) 92%, white); --mark: color-mix(in srgb, var(--face) 60%, white); --line: #38244c; --pink: #dd49d4; --violet: #7b4dff;
      --text: #fff; --dim: rgba(255, 255, 255, .7); --faint: rgba(255, 255, 255, .45);
      --pixel: "04b_03", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text); font: 16px/1.6 var(--pixel);
      -webkit-font-smoothing: none; font-smooth: never;
    }
    a { color: var(--pink); }
    button, select, input { font: inherit; color: inherit; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      width: min(100%, 1040px); margin: 0 auto; padding: 20px;
    }
    header .logo img { display: block; height: 48px; width: auto; }
    main { flex: 1; width: min(100%, 1040px); margin: 0 auto; padding: 0 20px 40px; }
    footer {
      border-top: 1px solid var(--line); padding: 24px 20px 32px;
      text-align: center; color: var(--dim);
    }
    footer p { margin: 0 auto; max-width: 560px; }

    .hero { margin: 24px 0 40px; max-width: 640px; }
    .hero h1 { margin: 0 0 12px; font-size: 32px; font-weight: normal; line-height: 1.2; }
    .hero p { margin: 0; color: var(--dim); }
    .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--panel); border: 2px solid var(--line);
      transition: transform .12s, border-color .12s, box-shadow .12s;
    }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; image-rendering: pixelated; background: #000; }
    .card div { display: flex; justify-content: center; padding: 14px; }
    .card span { background: var(--pink); color: #fff; padding: 2px 28px; box-shadow: 0 3px 0 #000; }
    .card:hover, .card:focus-visible, .card.on {
      outline: none; border-color: var(--pink); transform: translateY(-3px);
      box-shadow: 0 10px 30px -10px var(--pink);
    }
    .card.ghost { background: transparent; border: 2px dashed rgba(221, 73, 212, .35); color: var(--faint); cursor: pointer; }
    .card.ghost .blank {
      aspect-ratio: 4 / 3; background:
        linear-gradient(rgba(221, 73, 212, .28), rgba(221, 73, 212, .28)) center / 40px 2px no-repeat,
        linear-gradient(rgba(221, 73, 212, .28), rgba(221, 73, 212, .28)) center / 2px 40px no-repeat,
        #0c0614;
    }
    .card.ghost span { background: none; color: var(--faint); box-shadow: none; }
    .card.ghost:hover, .card.ghost:focus-visible, .card.ghost.on {
      border-color: rgba(221, 73, 212, .6); box-shadow: none;
    }
    dialog {
      border: 2px solid var(--line); background: var(--panel); color: var(--text);
      padding: 28px; max-width: 460px; width: calc(100% - 32px);
    }
    dialog::backdrop { background: #07030ccc; }
    dialog h2 { margin: 0 0 12px; font-size: 24px; font-weight: normal; line-height: 1.3; }
    dialog p { margin: 0 0 22px; color: var(--dim); }
    dialog menu { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0; padding: 0; }
    dialog a { background: var(--pink); color: #fff; text-decoration: none; padding: 8px 16px; box-shadow: 0 3px 0 #000; }
    dialog button { background: none; border: 0; color: var(--faint); cursor: pointer; padding: 0; }
    dialog code { font: inherit; color: var(--text); }
    .islands { display: block; width: min(100%, 720px); height: auto; margin: 56px auto 0; image-rendering: pixelated; opacity: .9; }

    .play { position: relative; isolation: isolate; display: grid; gap: 20px; justify-items: center; }
    .stage { display: contents; }
    .play::before {
      content: ""; position: absolute; inset: -40px -20px auto; height: 70%; z-index: -1;
      background: var(--cover) center / cover; filter: blur(70px) saturate(1.5); opacity: .35;
      pointer-events: none;
    }
    #screen {
      position: relative; aspect-ratio: 4 / 3; background: #000;
      width: min(100%, 960px, calc((100dvh - 200px) * 4 / 3));
      border: 2px solid var(--line); box-shadow: 0 20px 60px -20px #000, 0 0 0 1px #000;
    }
    #game { position: absolute; inset: 0; }
    #game canvas.ejs_canvas {
      width: 100% !important; height: 100% !important;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #bezel { position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% / 240); background: #000; z-index: 4; pointer-events: none; }
    #cover { position: absolute; inset: 0; z-index: 5; width: 100%; height: 100%; image-rendering: pixelated; }
    #cover[hidden] { display: none; }
    #play {
      position: absolute; left: 50%; top: 75%; transform: translate(-50%, -50%); z-index: 6;
      width: 40%; height: 15%; padding: 0; border: 2px solid var(--pink); cursor: pointer;
      background: var(--bg); color: #fff; font-size: clamp(16px, 3vw, 32px); letter-spacing: .1em;
      box-shadow: 0 4px 0 #000, 0 0 24px -4px var(--pink);
      animation: pulse 1.6s ease-in-out infinite;
    }
    #play:hover:not(:disabled) { background: var(--pink); }
    #play[hidden] { display: none; }
    #play:disabled { cursor: default; color: var(--faint); border-color: var(--line); box-shadow: 0 4px 0 #000; animation: none; }
    @keyframes pulse { 50% { box-shadow: 0 4px 0 #000, 0 0 36px 2px var(--pink); } }
    #game .ejs_start_button { display: none !important; }
    #game .ejs_menu_bar, #game .ejs_virtualGamepad_parent, #game .ejs_virtualGamepad_open,
    #game .ejs_popup_container { display: none !important; }

    .controls {
      display: grid; width: min(100%, 520px); align-items: center; gap: 20px 12px;
      grid-template: "pad face" auto "menu menu" auto / 1fr 1fr;
      -webkit-tap-highlight-color: transparent;
    }
    .controls :focus, .controls :focus-visible { outline: none; }
    .pad, .face { display: grid; grid-template: repeat(3, var(--b)) / repeat(3, var(--b)); gap: 4px; --b: clamp(48px, 14vw, 60px); }
    .pad { grid-area: pad; justify-self: start; display: block; width: calc(var(--b) * 3); height: calc(var(--b) * 3); }
    .face { grid-area: face; justify-self: end; }
    .pad svg { display: block; width: 100%; height: 100%; touch-action: none; }
    .pad path.body {
      fill: var(--face); stroke: #000; stroke-width: 3; stroke-linejoin: round;
      cursor: pointer; touch-action: none;
    }
    .pad path.body.on { stroke: var(--pink); }
    .pad path.hi { fill: var(--hi); stroke: none; pointer-events: none; filter: blur(2px); }
    .face [data-id=tri] { grid-area: 1 / 2; }
    .face [data-id=sqr] { grid-area: 2 / 1; }
    .face [data-id=cir] { grid-area: 2 / 3; }
    .face [data-id=crs] { grid-area: 3 / 2; }
    .menu { grid-area: menu; display: flex; gap: 36px; justify-content: center; align-items: flex-start; }
    button.btn, button.wide { touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
    button.btn {
      width: var(--b); height: var(--b); border: 2px solid #000; background: var(--panel);
      font-family: system-ui, sans-serif; font-size: 22px; box-shadow: none;
    }
    .face button.btn {
      display: grid; place-items: center;
      border-radius: 50%; color: transparent; font-size: 0;
      background: var(--face);
    }
    .face button.btn svg { width: 76%; height: 76%; }
    .face button.btn svg * { fill: none; stroke: var(--mark); }
    button.wide {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      height: auto; padding: 0; border: 0; background: none; box-shadow: none;
    }
    button.wide .shape { display: block; width: 64px; height: 40px; }
    button.wide .body { fill: var(--face); stroke: #000; stroke-width: 2; stroke-linejoin: round; }
    button.wide .hi { fill: var(--hi); stroke: none; filter: blur(2px); }
    button.wide .cap { font-size: 16px; line-height: 1; text-transform: uppercase; color: var(--mark); }
    button.btn.on, button.wide.on { background-color: var(--line); border-color: var(--pink); box-shadow: none; }
    .face button.btn.on { background: var(--face); }
    button.wide.on { background: none; border-color: transparent; box-shadow: none; }
    button.wide.on .body { stroke: var(--pink); }

    .bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 28px;
      width: min(100%, 960px); color: var(--dim);
    }
    .bar label { display: flex; align-items: center; gap: 10px; }
    .bar input[type=range] { accent-color: var(--pink); width: 120px; }
    .bar select { background: var(--panel); border: 2px solid var(--line); padding: 4px 8px; max-width: 220px; }
    .bar .link { background: none; border: 0; padding: 0; color: var(--pink); cursor: pointer; text-decoration: underline; }
    .keys { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; width: min(100%, 960px); color: var(--faint); }
    .keys kbd { font: inherit; color: var(--text); border: 1px solid var(--line); padding: 0 6px; margin-right: 4px; }
    @media (hover: hover) and (pointer: fine) { .controls { display: none; } }
    @media (hover: none), (pointer: coarse) { .keys { display: none; } }

    .note { color: var(--dim); }
    #more {
      display: none; background: none; border: 0; padding: 2px 0; cursor: pointer;
      color: var(--faint); font-size: 14px;
    }
    #more[hidden] { display: none; }
    .disc { display: none; gap: 12px; justify-items: start; }
    #more-sheet .disc:not([hidden]) { display: grid; }
    .disc p { margin: 0; }

    @media (max-width: 640px) {
      header { padding: 14px 16px; }
      header .logo img { height: 36px; }
      main { padding: 0 16px 32px; }
      .hero h1 { font-size: 24px; }
      .hero { margin: 8px 0 28px; }
      .bar { width: calc(100% - 32px); }
    }
    /* Phone only. A desktop-sized window keeps the framed, centered screen. */
    @media (max-width: 640px) {
      #more:not([hidden]) { display: inline; }
      .play > .bar { display: none; }
      #more-sheet .bar { display: grid; justify-items: start; gap: 18px; width: auto; }
      #more-sheet .getrom { display: none; }
      #more-sheet .disc a { background: var(--pink); color: #fff; text-decoration: none; padding: 8px 16px; box-shadow: 0 3px 0 #000; }
      html:has(.play) { height: 100%; overflow: hidden; }
      body:has(.play) {
        position: fixed; inset: 0; width: 100%;
        height: 100vh; height: 100svh; max-height: 100svh;
        min-height: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
      }
      body:has(.play) footer { display: none; }
      body:has(.play) header {
        width: 100%; flex: none;
      }
      body:has(.play) main {
        width: 100%; flex: 1; min-width: 0; min-height: 0; margin: 0; padding: 0;
        display: flex; flex-direction: column; overflow: hidden;
      }
      body:has(.play) .play {
        flex: 1; min-width: 0; min-height: 0; width: 100%; max-width: 100%; gap: 0; overflow: hidden;
        display: grid; grid-template-rows: minmax(0, 1fr) auto;
        align-content: stretch; justify-items: stretch;
      }
      body:has(.play) .play::before { left: 0; right: 0; height: 120%; }
      body:has(.play) .stage {
        grid-row: 1; min-width: 0; min-height: 0; width: 100%; max-width: 100%; height: 100%;
        container-type: size; overflow: hidden;
        display: flex; align-items: flex-start; justify-content: center;
      }
      body:has(.play) #screen {
        width: min(100%, calc(100cqb * 4 / 3)); max-width: 100%; height: auto;
        border: 0; box-shadow: none; margin: 0;
      }
      body:has(.play) .controls {
        grid-row: 2; position: static; width: 100%; min-width: 0; max-width: 100%;
        container-type: inline-size;
        gap: clamp(48px, 8svh, 72px) 16px;
        padding: 0 16px calc(12px + env(safe-area-inset-bottom));
      }
      body:has(.play) .pad, body:has(.play) .face {
        --b: clamp(36px, calc((100cqi - 72px) / 6), 56px);
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./" aria-label="Parascene Games"><img src="brand/logo.png" alt="Parascene Games" width="476" height="132"></a>
    <button type="button" id="more" hidden>More</button>
  </header>
  <main id="app"></main>
  <footer>
    <p>Play something. Tell us what broke. Come help make the next thing at <a href="https://www.parascene.com" target="_blank" rel="noopener">parascene.com</a>.</p>
  </footer>
  <script>
    window.__audioCtxs = [];
    for (const name of ["AudioContext", "webkitAudioContext"]) {
      const Orig = window[name];
      if (!Orig) continue;
      window[name] = class extends Orig {
        constructor(...args) {
          super(...args);
          window.__audioCtxs.push(this);
          if (navigator.userActivation?.isActive) this.resume();
        }
      };
    }

    /* gp is the standard Gamepad button. The stick axes match the d-pad. */
    const BUTTONS = [
      { id: "up", idx: 4, gp: 12, axis: 1, sign: -1, keys: ["ArrowUp", "KeyW"], label: "↑", slot: "pad" },
      { id: "left", idx: 6, gp: 14, axis: 0, sign: -1, keys: ["ArrowLeft", "KeyA"], label: "←", slot: "pad" },
      { id: "right", idx: 7, gp: 15, axis: 0, sign: 1, keys: ["ArrowRight", "KeyD"], label: "→", slot: "pad" },
      { id: "down", idx: 5, gp: 13, axis: 1, sign: 1, keys: ["ArrowDown", "KeyS"], label: "↓", slot: "pad" },
      { id: "tri", idx: 9, gp: 3, keys: ["KeyI"], label: "△", slot: "face" },
      { id: "sqr", idx: 1, gp: 2, keys: ["KeyJ"], label: "□", slot: "face" },
      { id: "cir", idx: 8, gp: 1, keys: ["KeyL"], label: "○", slot: "face" },
      { id: "crs", idx: 0, gp: 0, keys: ["KeyK", "Space"], label: "✕", slot: "face" },
      { id: "select", idx: 2, gp: 8, keys: ["ShiftLeft", "ShiftRight"], label: "Select", slot: "menu" },
      { id: "start", idx: 3, gp: 9, keys: ["Enter"], label: "Start", slot: "menu" },
    ];
    const PAD = ["BUTTON_2", "BUTTON_4", "SELECT", "START", "DPAD_UP", "DPAD_DOWN", "DPAD_LEFT", "DPAD_RIGHT",
      "BUTTON_1", "BUTTON_3", "LEFT_TOP_SHOULDER", "RIGHT_TOP_SHOULDER", "LEFT_BOTTOM_SHOULDER",
      "RIGHT_BOTTOM_SHOULDER", "LEFT_STICK", "RIGHT_STICK", "LEFT_STICK_X:+1", "LEFT_STICK_X:-1",
      "LEFT_STICK_Y:+1", "LEFT_STICK_Y:-1", "RIGHT_STICK_X:+1", "RIGHT_STICK_X:-1",
      "RIGHT_STICK_Y:+1", "RIGHT_STICK_Y:-1"];

    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    let pageVolume = 1;
    try { pageVolume = Number(localStorage.getItem("parascene.volume") ?? "100") / 100; } catch { /* private mode */ }
    if (!Number.isFinite(pageVolume)) pageVolume = 1;

    function unlockAudio() {
      for (const c of window.__audioCtxs) c.resume();
      if (window.__music && window.__music.wantPlay) window.__music.el.play().catch(() => {});
    }
    function pumpAudio() {
      unlockAudio();
      if (navigator.userActivation?.isActive) requestAnimationFrame(pumpAudio);
    }
    function applyEmuVolume() {
      const emu = window.EJS_emulator;
      if (emu && typeof emu.setVolume === "function") emu.setVolume(pageVolume);
    }
    for (const t of ["pointerdown", "keydown"]) addEventListener(t, unlockAudio, true);

    /* GitHub Pages cannot send COOP/COEP. The worker adds them, then one reload
     * picks up a document it actually controlled. Reloading with no controller
     * never isolates the tab, so that path does not count as progress. */
    async function isolate() {
      const KEY = "coi-reloads";
      if (window.crossOriginIsolated) {
        try { sessionStorage.removeItem(KEY); } catch { /* private mode */ }
        return "ok";
      }
      if (!navigator.serviceWorker) return "blocked";
      const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" });
      await navigator.serviceWorker.ready;
      const worker = reg.active || reg.waiting || reg.installing;
      if (worker && !navigator.serviceWorker.controller) worker.postMessage("claim");
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) => {
          navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
          setTimeout(resolve, 4000);
        });
      }
      if (!navigator.serviceWorker.controller) return "blocked";
      let tried = false;
      try { tried = sessionStorage.getItem(KEY) === "1"; } catch { /* private mode */ }
      if (tried) return "blocked";
      try { sessionStorage.setItem(KEY, "1"); } catch { /* private mode */ }
      location.reload();
      return "reload";
    }

    function parseRow(bytes) {
      if (bytes[0] !== 0x57 || bytes[1] !== 0x45 || bytes[2] !== 0x42 || bytes[3] !== 0x31) return null;
      if (bytes[4] !== 1) return null;
      const len = bytes[5];
      if (len > 33) return null;
      let sum = 0;
      for (let i = 0; i < len; i++) sum = (sum + bytes[7 + i]) & 255;
      if (sum !== bytes[6]) return null;
      const cmds = [];
      let p = 0;
      while (p + 1 < len) {
        const id = bytes[7 + p];
        if (id === 0) break;
        const argLen = bytes[7 + p + 1];
        if (p + 2 + argLen > len) break;
        cmds.push({ id, args: bytes.slice(7 + p + 2, 7 + p + 2 + argLen) });
        p += 2 + argLen;
      }
      return cmds;
    }

    function Music(game) {
      const FADE_MS = 2000;
      let seq = 0;
      let gameVol = 128;
      let active = null;
      let outgoing = null;
      let raf = 0;
      function loud() {
        return Math.max(0, Math.min(1, gameVol / 128 * pageVolume));
      }
      function clampVol(v) {
        return Math.max(0, Math.min(1, v));
      }
      function release(voice) {
        voice.el.pause();
        voice.el.removeAttribute("src");
        voice.el.load();
      }
      /* Equal-power overlap: outgoing falls as cos, incoming rises as sin. */
      function paint(now) {
        raf = 0;
        const master = loud();
        let more = false;
        if (active && active.fadeIn) {
          const t = Math.min(1, (now - active.fadeIn) / FADE_MS);
          active.env = Math.sin(t * Math.PI / 2);
          if (t >= 1) active.fadeIn = 0;
          else more = true;
        }
        if (active) active.el.volume = clampVol(active.env * master);
        if (outgoing) {
          const t = Math.min(1, (now - outgoing.start) / FADE_MS);
          outgoing.el.volume = clampVol(outgoing.from * Math.cos(t * Math.PI / 2) * master);
          if (t >= 1) {
            release(outgoing);
            outgoing = null;
          } else more = true;
        }
        if (more) raf = requestAnimationFrame(paint);
      }
      function touch() {
        if (!raf) paint(performance.now());
      }
      function retire(voice) {
        if (outgoing) release(outgoing);
        outgoing = { el: voice.el, from: voice.env, start: performance.now() };
      }
      function begin(src, fade) {
        const el = new Audio();
        el.preload = "auto";
        el.src = src;
        const voice = { el, env: fade ? 0 : 1, fadeIn: fade ? performance.now() : 0 };
        el.volume = clampVol(voice.env * loud());
        if (active) retire(active);
        active = voice;
        api.el = el;
        api.wantPlay = true;
        el.play().catch(() => {});
        if (fade || outgoing) {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          paint(performance.now());
        }
      }
      const api = {
        el: new Audio(),
        wantPlay: false,
        stop() {
          seq = 0;
          api.wantPlay = false;
          if (!active) return;
          retire(active);
          active = null;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          paint(performance.now());
        },
        command(cmds) {
          for (const cmd of cmds) {
            if (cmd.id === 1) api.stop();
            else if (cmd.id === 2 && cmd.args.length >= 3) {
              const sequence = cmd.args[0];
              const track = cmd.args[1];
              gameVol = cmd.args[2];
              if (sequence !== seq && sequence !== 0 && game.audio[track]) {
                seq = sequence;
                begin(new URL(game.audio[track], document.baseURI).href, !!(active || outgoing));
              }
            }
          }
          touch();
        },
        setPageVolume(v) {
          pageVolume = v;
          try { localStorage.setItem("parascene.volume", String(Math.round(v * 100))); } catch { /* private mode */ }
          touch();
        }
      };
      return api;
    }

    function rowBytes(data, width) {
      const bytes = new Uint8Array(40);
      const n = Math.min(320, width);
      for (let i = 0; i < n; i++) {
        const o = i * 4;
        if (data[o] >= 128 && data[o + 1] >= 128 && data[o + 2] >= 128)
          bytes[i >> 3] |= 0x80 >> (i & 7);
      }
      return bytes;
    }

    const strip = document.createElement("canvas");
    strip.width = 320;
    strip.height = 1;
    const stripCtx = strip.getContext("2d", { willReadFrequently: true, alpha: false });

    /* One scanline from the displayed frame. A cleared WebGL buffer reads as black and fails the magic check. */
    function readCanvasRow(game) {
      const src = document.querySelector("#game canvas.ejs_canvas");
      if (!src || !src.width || !src.height) return null;
      const rowH = src.height / game.height;
      stripCtx.imageSmoothingEnabled = false;
      stripCtx.drawImage(src, 0, src.height - rowH, src.width, rowH, 0, 0, game.width, 1);
      return rowBytes(stripCtx.getImageData(0, 0, game.width, 1).data, game.width);
    }

    async function readShotRow(game) {
      const emu = window.EJS_emulator;
      if (!emu?.gameManager?.screenshot) return null;
      const png = await emu.gameManager.screenshot();
      const bmp = await createImageBitmap(new Blob([png], { type: "image/png" }));
      const canvas = document.createElement("canvas");
      canvas.width = game.width;
      canvas.height = game.height;
      const g = canvas.getContext("2d", { willReadFrequently: true });
      g.imageSmoothingEnabled = false;
      g.drawImage(bmp, 0, 0, game.width, game.height);
      const bytes = rowBytes(g.getImageData(0, game.height - 1, game.width, 1).data, game.width);
      bmp.close?.();
      return bytes;
    }

    /* Auto frameskip drops a paint only while the audio buffer is low, and
     * never two in a row. If that signal is idle and the picture is still
     * late, fall back to skipping every other paint. */
    function watchPace() {
      const probe = document.createElement("canvas");
      probe.width = 8;
      probe.height = 8;
      const pg = probe.getContext("2d", { willReadFrequently: true, alpha: false });
      let tries = 0;
      function measure() {
        const src = document.querySelector("#game canvas.ejs_canvas");
        if (!src || !src.width) {
          if (tries++ < 8) setTimeout(measure, 500);
          return;
        }
        const deltas = [];
        let lastHash = "";
        let lastChange = 0;
        const t0 = performance.now();
        function tick(now) {
          if (now - t0 > 2000) {
            decide(deltas);
            return;
          }
          try {
            pg.drawImage(src, src.width * 0.35, src.height * 0.35, src.width * 0.3, src.height * 0.3, 0, 0, 8, 8);
            const d = pg.getImageData(0, 0, 8, 8).data;
            let hash = 0;
            for (let i = 0; i < d.length; i += 16) hash = (hash * 33 + d[i]) >>> 0;
            const key = String(hash);
            if (key !== lastHash) {
              if (lastChange && now - lastChange < 80) deltas.push(now - lastChange);
              lastChange = now;
              lastHash = key;
            }
          } catch { /* canvas not readable yet */ }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      function decide(deltas) {
        const gm = window.EJS_emulator && EJS_emulator.gameManager;
        if (!gm) return;
        if (deltas.length < 20) {
          if (tries++ < 6) setTimeout(measure, 500);
          return;
        }
        deltas.sort((a, b) => a - b);
        const mid = deltas[deltas.length >> 1];
        if (mid <= 22) return;
        gm.setVariable("pcsx_rearmed_frameskip_type", "fixed_interval");
        gm.setVariable("pcsx_rearmed_frameskip_interval", "1");
      }
      setTimeout(measure, 1500);
    }

    /* The core sizes its canvas from this observer. Report the PlayStation
     * frame so a retina display does not allocate a multi-megapixel bitmap.
     * CSS stretches that bitmap to the on-page box. */
    function lockFrameSize(game) {
      const Native = window.ResizeObserver;
      if (!Native || Native.__frameLock) return;
      const wrap = (entries) => entries.map((entry) => {
        const t = entry.target;
        if (!(t instanceof HTMLCanvasElement) || !t.closest("#game")) return entry;
        const box = [{ inlineSize: game.width, blockSize: game.height }];
        return new Proxy(entry, {
          get(obj, prop) {
            if (prop === "contentRect") return new DOMRectReadOnly(0, 0, game.width, game.height);
            if (prop === "devicePixelContentBoxSize" || prop === "contentBoxSize" || prop === "borderBoxSize") return box;
            const v = obj[prop];
            return typeof v === "function" ? v.bind(obj) : v;
          }
        });
      });
      const Locked = class extends Native {
        constructor(cb) { super((entries, obs) => cb(wrap(entries), obs)); }
      };
      Locked.__frameLock = true;
      window.ResizeObserver = Locked;
    }

    function boot(game) {
      const GM = { value: undefined };
      Object.defineProperty(window, "EJS_GameManager", {
        configurable: true,
        get: () => GM.value,
        set(v) {
          GM.value = v;
          const cfg = v.prototype.getRetroArchCfg;
          v.prototype.getRetroArchCfg = function () { return cfg.call(this) + "audio_sync = false\n"; };
        },
      });
      /* Keyboard and the physical pad both go through simulateInput. */
      window.EJS_defaultControls = {
        0: Object.fromEntries(PAD.map((v, i) => [i, { value: "", value2: "" }])),
        1: {}, 2: {}, 3: {}
      };
      window.EJS_player = "#game";
      window.EJS_core = "psx";
      window.EJS_gameName = game.id;
      window.EJS_gameUrl = new URL(game.bin, document.baseURI).href;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
      /* The core waits for Play. In 4.2.3, auto language is skipped only when this is false. */
      window.EJS_startOnLoaded = false;
      window.EJS_disableAutoLang = false;
      window.EJS_backgroundColor = "#000";
      window.EJS_cacheLimit = 0;
      window.EJS_threads = true;
      window.EJS_volume = pageVolume;
      const coreOpts = {
        ejs_threads: "enabled",
        pcsx_rearmed_dithering: "disabled",
        pcsx_rearmed_nocdaudio: "disabled",
        pcsx_rearmed_frameskip_type: "auto_threshold",
        pcsx_rearmed_frameskip_threshold: "45",
        pcsx_rearmed_frameskip_interval: "1"
      };
      window.EJS_defaultOptions = { "virtual-gamepad": "disabled", ...coreOpts };
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !/^ejs-.*-settings$/.test(key)) continue;
          const saved = JSON.parse(localStorage.getItem(key) || "null");
          if (!saved || !saved.settings) continue;
          let dirty = false;
          for (const [k, v] of Object.entries(coreOpts)) {
            if (saved.settings[k] !== v) {
              saved.settings[k] = v;
              dirty = true;
            }
          }
          if (dirty) localStorage.setItem(key, JSON.stringify(saved));
        }
      } catch { /* private mode */ }
      window.EJS_onGameStart = () => {
        unlockAudio();
        applyEmuVolume();
        setTimeout(applyEmuVolume, 1000);
        setTimeout(applyEmuVolume, 3000);
        pumpAudio();
        watchPace();
      };
      window.EJS_ready = () => {
        const play = document.getElementById("play");
        if (!play || play.hidden) return;
        play.disabled = false;
        play.textContent = "Play";
      };
      const data = "https://cdn.emulatorjs.org/4.2.3/data/";
      for (const url of [window.EJS_gameUrl, data + "cores/pcsx_rearmed-thread-wasm.data", data + "emulator.min.js"])
        fetch(url).catch(() => {});
      document.body.append(Object.assign(document.createElement("script"), {
        src: data + "loader.js"
      }));
      lockFrameSize(game);
      const keep = (proto) => {
        if (!proto || proto.__rowBuffer || !proto.getContext) return;
        const orig = proto.getContext;
        proto.__rowBuffer = true;
        proto.getContext = function (type, attrs) {
          if (typeof type === "string" && type.startsWith("webgl"))

        };
      };
      keep(HTMLCanvasElement.prototype);
      if (typeof OffscreenCanvas === "function") keep(OffscreenCanvas.prototype);
      let busy = false;
      let canvasRow = false;
      let lastShot = 0;
      setInterval(async () => {
        if (busy) return;
        const emu = window.EJS_emulator;
        if (!emu?.started || emu.paused) return;
        busy = true;
        try {
          let bytes = null;
          try { bytes = readCanvasRow(game); } catch { bytes = null; }
          if (bytes && parseRow(bytes)) canvasRow = true;
          else bytes = null;
          /* The PNG path stalls the core. Use it only until the canvas row is readable. */
          if (!bytes && !canvasRow && performance.now() - lastShot > 1000) {
            lastShot = performance.now();
            bytes = await readShotRow(game);
          }
          const cmds = bytes && parseRow(bytes);
          if (cmds) window.__music.command(cmds);
        } catch { /* frame not ready */ }
        busy = false;
      }, 200);
    }

    function wirePad() {
      const byKey = new Map();
      for (const b of BUTTONS) {
        b.el = document.querySelector(`[data-id="${b.id}"]`);
        b.holders = new Set();
        for (const k of b.keys) byKey.set(k, b);
      }
      function send(b) {
        const gm = window.EJS_emulator && EJS_emulator.gameManager;
        if (gm) gm.simulateInput(0, b.idx, b.holders.size ? 1 : 0);
        b.el.classList.toggle("on", b.holders.size > 0);
      }
      function hold(b, who) { if (!b.holders.has(who)) { b.holders.add(who); send(b); } }
      function free(b, who) { if (b.holders.delete(who)) send(b); }
      addEventListener("keydown", (e) => {
        const b = byKey.get(e.code);
        if (!b || e.metaKey || e.ctrlKey || e.altKey) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (!e.repeat) hold(b, e.code);
      }, true);
      addEventListener("keyup", (e) => {
        const b = byKey.get(e.code);
        if (!b) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        free(b, e.code);
      }, true);
      addEventListener("blur", () => {
        for (const b of BUTTONS) {
          for (const who of [...b.holders]) if (who !== "pad") b.holders.delete(who);
          send(b);
        }
      });
      const padpick = document.getElementById("padpick");
      const status = document.getElementById("status");
      let chosen = null;
      let padSig = null;
      const hid = { device: null, hat: 8, face: 0, shoulder: 0, lx: 0, ly: 0 };
      const SONY = [
        { vendorId: 0x054c, productId: 0x0ce6, usagePage: 0x01 },
        { vendorId: 0x054c, productId: 0x0df2, usagePage: 0x01 }
      ];
      padpick.addEventListener("change", () => {
        chosen = padpick.value === "" ? null : padpick.value === "hid" ? "hid" : Number(padpick.value);
      });
      function padName(p) {
        const id = p.id || "";
        const n = p.index + 1;
        if (/dualsense|0ce6|ps5/i.test(id)) return "PS5 controller " + n;
        if (/054c|wireless controller|playstation/i.test(id)) return "PlayStation controller " + n;
        const short = id.split("(")[0].trim();
        return (short || "Controller") + " " + n;
      }
      function hidPressed(b) {
        const hat = hid.hat;
        const dir = {
          up: hat === 0 || hat === 1 || hat === 7,
          right: hat === 1 || hat === 2 || hat === 3,
          down: hat === 3 || hat === 4 || hat === 5,
          left: hat === 5 || hat === 6 || hat === 7
        };
        if (b.id === "up") return dir.up || hid.ly < -0.5;
        if (b.id === "down") return dir.down || hid.ly > 0.5;
        if (b.id === "left") return dir.left || hid.lx < -0.5;
        if (b.id === "right") return dir.right || hid.lx > 0.5;
        if (b.id === "sqr") return !!(hid.face & 0x10);
        if (b.id === "crs") return !!(hid.face & 0x20);
        if (b.id === "cir") return !!(hid.face & 0x40);
        if (b.id === "tri") return !!(hid.face & 0x80);
        if (b.id === "select") return !!(hid.shoulder & 0x10);
        if (b.id === "start") return !!(hid.shoulder & 0x20);
        return false;
      }
      function readHid(reportId, buf) {
        const data = buf instanceof DataView ? buf : new DataView(buf);
        let stick = 0;
        let buttons = 7;
        if (reportId === 0x31) { stick = 1; buttons = 8; }
        else if (data.byteLength < 50) { stick = 0; buttons = 4; }
        if (data.byteLength < buttons + 2) return;
        hid.lx = (data.getUint8(stick) - 128) / 128;
        hid.ly = (data.getUint8(stick + 1) - 128) / 128;
        const hatByte = data.getUint8(buttons);
        hid.hat = hatByte & 0x0f;
        hid.face = hatByte & 0xf0;
        hid.shoulder = data.getUint8(buttons + 1);
      }
      async function openHid(device) {
        if (!device.opened) await device.open();
        hid.device = device;
        device.oninputreport = (e) => readHid(e.reportId, e.data);
        chosen = "hid";
        padSig = "";
        if (status) status.textContent = device.productName || "PS5 controller";
      }
      function syncPads(list) {
        const sig = list.map(p => p.index + ":" + p.id).join("|") + (hid.device ? "|hid" : "");
        if (sig === padSig) return;
        padSig = sig;
        const previous = chosen;
        padpick.replaceChildren();
        if (!list.length && !hid.device) {
          const o = document.createElement("option");
          o.value = "";
          o.textContent = "Press ✕ on a pad";
          padpick.append(o);
          chosen = null;
          if (status) status.textContent = navigator.hid
            ? "Click Find and choose the PS5 controller."
            : "Click the page, then press ✕ on the controller.";
          return;
        }
        for (const p of list) {
          const o = document.createElement("option");
          o.value = String(p.index);
          o.textContent = padName(p);
          padpick.append(o);
        }
        if (hid.device) {
          const o = document.createElement("option");
          o.value = "hid";
          o.textContent = hid.device.productName || "PS5 controller";
          padpick.append(o);
        }
        const values = [...padpick.options].map(o => o.value);
        if (previous != null && values.includes(String(previous))) chosen = previous;
        else chosen = hid.device ? "hid" : list[0].index;
        padpick.value = String(chosen);
        if (status) status.textContent = padpick.selectedOptions[0]?.textContent || "";
      }
      document.getElementById("findpad").addEventListener("click", async () => {
        if (!navigator.hid) {
          if (status) status.textContent = "This browser has no controller chooser. Click the page and press ✕.";
          return;
        }
        try {
          const devices = await navigator.hid.requestDevice({ filters: SONY });
          if (devices[0]) await openHid(devices[0]);
        } catch {
          if (status) status.textContent = "Controller chooser was closed.";
        }
      });
      if (navigator.hid) {
        navigator.hid.getDevices().then(devices => {
          const found = devices.find(d => d.vendorId === 0x054c);
          if (found) openHid(found).catch(() => {});
        }).catch(() => {});
        navigator.hid.addEventListener("disconnect", (e) => {
          if (e.device === hid.device) {
            hid.device = null;
            padSig = "";
          }
        });
      }
      addEventListener("gamepadconnected", () => { padSig = ""; });
      (function watchPads() {
        const list = [...(navigator.getGamepads?.() || [])].filter(Boolean);
        syncPads(list);
        const pad = chosen === "hid" ? null : list.find(p => p.index === chosen);
        let any = false;
        for (const b of BUTTONS) {
          const axis = b.axis != null && pad && (pad.axes[b.axis] || 0) * b.sign > 0.5;
          const down = chosen === "hid" && hid.device
            ? hidPressed(b)
            : !!(pad && (pad.buttons[b.gp]?.pressed || axis));
          if (down) { hold(b, "pad"); any = true; }
          else free(b, "pad");
        }
        requestAnimationFrame(watchPads);
      })();
      for (const b of BUTTONS) {
        b.el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          try { b.el.setPointerCapture(e.pointerId); } catch { /* already gone */ }
          hold(b, "p" + e.pointerId);
        });
        for (const t of ["pointerup", "pointercancel", "lostpointercapture"])
          b.el.addEventListener(t, (e) => free(b, "p" + e.pointerId));
      }
    }

    function showPicker(games) {

      app.innerHTML = `

      /* Ghosts only complete a row. A single column has no row to fill, so it gets one. */
      function ghostSlots(cols) {
        if (cols <= 1) return 1;
        return (cols - (games.length % cols)) % cols;
      }
      function openSlot() {
        const slot = document.createElement("button");
        slot.type = "button";
        slot.className = "card ghost";
        slot.setAttribute("aria-label", "An open spot. Come build a game with Parascene.");
        slot.innerHTML = `<div class="blank"></div><div><span>Open</span></div>`;
        slot.addEventListener("click", () => {
          const dialog = document.getElementById("join");
          if (!dialog.open) dialog.showModal();
        });
        return slot;
      }
      let cards = [];
      function fillRow() {
        const cols = getComputedStyle(list).gridTemplateColumns.split(" ").filter(Boolean).length;
        const want = ghostSlots(cols);
        const have = list.querySelectorAll(".ghost").length;
        if (have === want) return;
        list.querySelectorAll(".ghost").forEach((el) => el.remove());
        for (let n = 0; n < want; n++) list.append(openSlot());
        cards = [...list.querySelectorAll(".card")];
        if (at >= cards.length) at = 0;
        if (prev.seen) cards.forEach((c, n) => c.classList.toggle("on", n === at));
      }

      let prev = {};

      const rows = new ResizeObserver(() => {
        if (!list.isConnected) { rows.disconnect(); return; }
        fillRow();
      });

        if (!list.isConnected) { rows.disconnect(); return; }
        const pads = [...(navigator.getGamepads?.() || [])].filter(Boolean);
        const pad = pads[0];
        if (pad && cards.length && !document.getElementById("join").open) {
          if (!prev.seen) cards[at].classList.add("on");
          const stickX = pad.axes[0] || 0;
          const stickY = pad.axes[1] || 0;
          const now = {
            prev: (pad.buttons[14]?.pressed || stickX < -0.5) || (pad.buttons[12]?.pressed || stickY < -0.5),
            next: (pad.buttons[15]?.pressed || stickX > 0.5) || (pad.buttons[13]?.pressed || stickY > 0.5),
            go: pad.buttons[0]?.pressed || pad.buttons[9]?.pressed,
            seen: true
          };
          if (now.prev && !prev.prev) at = (at + cards.length - 1) % cards.length;
          if (now.next && !prev.next) at = (at + 1) % cards.length;
          if ((now.prev && !prev.prev) || (now.next && !prev.next))
            cards.forEach((c, n) => c.classList.toggle("on", n === at));
          if (now.go && !prev.go) cards[at].click();
          prev = now;
        }
        requestAnimationFrame(watchPicker);
      })();
    }

            <button type="button" class="link getrom" id="getdisc" hidden>Download ROM</button>
            <div id="rom" class="disc" hidden>
              <p>The full disc has CD music. Unzip it and open <code>${game.id}.cue</code> in DuckStation, or burn it.</p>
              <a id="getdisc-link" download>Download BIN/CUE</a>
            </div>
            <span id="status" hidden></span>
          </div>
          <dialog id="more-sheet">
            <h2>More</h2>
            <menu>
              <span></span>
              <button type="button" id="more-close">Close</button>
            </menu>
          </dialog>
          <dialog id="disc">
            <h2>Play it on a real PlayStation</h2>
            <p>The full disc has CD music. Unzip it and open <code>${game.id}.cue</code> in DuckStation, or burn it.</p>
            <menu>
              <a id="disc-link" download>Download BIN/CUE</a>
              <button type="button" id="disc-close">Close</button>
            </menu>
          </dialog>
        </div>`;
      if (game.cover) {
        const url = new URL(game.cover, document.baseURI).href;
        const cover = document.getElementById("cover");
        cover.src = url;
        cover.hidden = false;
        app.querySelector(".play").style.setProperty("--cover", `url("${url}")`);
      }
      if (!navigator.hid) document.getElementById("findpad").hidden = true;
      for (const b of BUTTONS) {
        if (b.slot === "pad") continue;
        const el = document.createElement("button");
        el.type = "button";
        el.className = b.slot === "menu" ? "wide" : "btn";
        el.dataset.id = b.id;
        el.setAttribute("aria-label", b.label);
        if (b.slot === "menu") {
          const draw = b.id === "start"
            ? `<path class="body" d="M3 2 L61 20 L3 38 Z"/><path class="hi" d="M18 11 L42 18.5 L42 21.5 L18 14 Z"/>`
            : `<rect class="body" x="1.5" y="1.5" width="61" height="37" rx="8"/><rect class="hi" x="10" y="7" width="44" height="6" rx="1"/>`;
          el.innerHTML = `<svg class="shape" viewBox="0 0 64 40">${draw}</svg><span class="cap">${b.label}</span>`;
        } else if (b.slot === "face") {
          const mark = {
            tri: `<path d="M50 6 L88 78 L12 78 Z" stroke-width="9" stroke-linejoin="round"/>`,
            sqr: `<rect x="22" y="22" width="56" height="56" stroke-width="9"/>`,
            cir: `<circle cx="50" cy="50" r="38" stroke-width="11"/>`,
            crs: `<path d="M18 18 L82 82 M82 18 L18 82" stroke-width="11" stroke-linecap="round"/>`,
          }[b.id];
          el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${mark}</svg>`;
        } else el.textContent = b.label;
        document.querySelector(`[data-slot="${b.slot}"]`).append(el);
      }
      document.getElementById("vol").addEventListener("input", (e) => {
        window.__music.setPageVolume(Number(e.target.value) / 100);
        applyEmuVolume();
      });
      const sheet = document.getElementById("more-sheet");
      const play = app.querySelector(".play");
      document.getElementById("more").addEventListener("click", () => {
        sheet.insertBefore(play.querySelector(".bar"), sheet.querySelector("menu"));
        if (!sheet.open) sheet.showModal();
      });
      document.getElementById("more-close").addEventListener("click", () => sheet.close());
      sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
      sheet.addEventListener("close", () => {
        const bar = sheet.querySelector(".bar");
        if (bar) play.append(bar);
      });
      offerDisc(game);
      window.__music = Music(game);
      wirePad();
      boot(game);
      document.getElementById("play").addEventListener("click", () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          const ctx = new AC();
          ctx.resume();
        }
        unlockAudio();
        pumpAudio();
        const start = document.querySelector("#game .ejs_start_button");
        if (start) start.click();
        document.getElementById("play").hidden = true;
        document.getElementById("cover").hidden = true;
      });
    }

    (async () => {
      let manifest;
      try {
        manifest = await (await fetch("manifest.json")).json();
      } catch {
        app.textContent = "No game list.";
        return;
      }
      const id = params.get("game") || document.documentElement.dataset.game;
      const game = (manifest.games || []).find((g) => g.id === id);
      if (!id) {
        showPicker(manifest.games || []);
        return;
      }
      if (!game) {
        app.textContent = "That game is not on this site.";
        return;
      }
      const isolated = await isolate();
      if (isolated === "reload") return;
      if (isolated !== "ok") {
        app.innerHTML = `<p class="note">This page only works in a browser with a service worker enabled.</p>`;
        return;
      }
      showPlayer(game);
    })();
  </script>
</body>
</html>
